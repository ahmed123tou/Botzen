<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Botzen — Sign Up</title>

<link
    rel="icon"
    href="https://img.icons8.com/nolan/1200/bot.jpg"
>

<link rel="stylesheet" href="style.css">


</head>

<body>


<main class="auth-card">

    <img
        class="botzen-icon"
        src="https://img.icons8.com/nolan/1200/bot.jpg"
        alt="Botzen"
    >

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <h1>Welcome to Botzen</h1>

        <p class="subtitle">
            Manage your Discord bots from one powerful dashboard.
        </p>

        <button
            id="discordButton"
            class="discord-btn"
            type="button"
        >
            Continue with Discord
        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <button
            id="signupButton"
            class="signup-btn"
            type="button"
        >
            Sign up without Discord
        </button>

        <p class="secure-text">
            🔒 Your account is securely protected
        </p>

    </div>


    <!-- SIGNUP SCREEN -->

    <div id="signupScreen" style="display: none;">

        <h1>Create your Botzen account</h1>

        <p class="subtitle">
            Create an account without using Discord.
        </p>

        <form id="signupForm">

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <div class="password-wrapper">

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                >

                <button
                    id="passwordToggle"
                    class="password-toggle"
                    type="button"
                >
                    Show
                </button>

            </div>

            <button
                class="discord-btn"
                type="submit"
            >
                Create Account
            </button>

        </form>

        <button
            id="backButton"
            class="signup-btn"
            type="button"
        >
            ← Back to Login
        </button>

        <p
            id="signupMessage"
            class="secure-text"
        ></p>

    </div>

</main>

<script src="script.js"></script>


</body>
</html>
