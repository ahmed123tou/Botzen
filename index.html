<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Botzen — Sign Up</title>

<link
    rel="icon"
    href="https://img.icons8.com/nolan/1200/bot.jpg"
>

<link rel="stylesheet" href="style.css">


</head>

<body>


<main class="auth-card">

    <img
        class="botzen-icon"
        src="https://img.icons8.com/nolan/1200/bot.jpg"
        alt="Botzen"
    >

    <h1>Welcome to Botzen</h1>

    <p class="subtitle">
        Manage your Discord bots from one powerful dashboard.
    </p>

    <button
        id="discordButton"
        class="discord-btn"
        type="button"
    >
        Continue with Discord
    </button>

    <div class="divider">
        <span>OR</span>
    </div>

    <a
        href="/signup.html"
        class="signup-btn"
    >
        Sign up without Discord
    </a>

    <p class="secure-text">
        🔒 Your account is securely protected
    </p>

</main>

<script src="script.js"></script>


</body>
</html>
